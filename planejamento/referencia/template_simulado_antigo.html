<!-- Referência: modelo do simulado digital usado em sala (um arquivo por semana, com os dados embutidos). Não é o site novo. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<!--
  COMO LIGAR À PLANILHA (opcional)
  1. Crie uma planilha no Google Sheets, abra Extensões > Apps Script e cole o código abaixo.
  2. Implantar > Nova implantação > Aplicativo da Web > Acesso: Qualquer pessoa. Copie a URL.
  3. Cole a URL em URL_DA_PLANILHA no início do script deste arquivo.

  function doPost(e) {
    var d = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh = ss.getSheetByName('Respostas') || ss.insertSheet('Respostas');
    var keys = Object.keys(d);
    if (sh.getLastRow() === 0) sh.appendRow(['data'].concat(keys));
    sh.appendRow([new Date()].concat(keys.map(function (k) { return d[k]; })));
    return ContentService.createTextOutput('ok');
  }
-->
<style>
:root{
--primary:#1c7293;--primary-hover:#155a75;--secondary:#12294a;--ok:#1a8f6a;--ok-bg:#e3f5ee;--bad:#c0245f;--bad-bg:#fbe8f0;--warn:#9a6b00;--warn-bg:#fdf3dc;
--bg:#f4f7f6;--card:#fff;--text:#1b2a3a;--muted:#5f6b76;--line:#e1e7ec;--shadow:0 8px 16px rgba(0,0,0,.08);--r:12px;--rl:20px;
--font:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font);}
body{background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
.container{max-width:860px;margin:0 auto;padding:1.5rem 1rem 3rem;}
.card{background:var(--card);border-radius:var(--rl);box-shadow:var(--shadow);padding:1.8rem;margin-bottom:1.3rem;}
h1{color:var(--secondary);font-size:1.8rem;line-height:1.25;margin-bottom:.3rem;}
h2{color:var(--muted);font-size:1.05rem;font-weight:500;}
h3{color:var(--primary);margin-bottom:.9rem;border-bottom:2px solid var(--line);padding-bottom:.4rem;font-size:1.15rem;}
header{text-align:center;margin-bottom:1.4rem;}
.by{color:var(--muted);font-size:.9rem;margin-top:.3rem;text-align:center;}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-right:6px;}
.badge-d{background:rgba(28,114,147,.12);color:var(--primary);}
.badge-t{background:rgba(18,41,74,.08);color:var(--secondary);}
.intro{list-style:none;margin:1rem auto 1.4rem;max-width:520px;text-align:left;}
.intro li{padding:6px 0 6px 26px;position:relative;}
.intro li:before{content:"▸";position:absolute;left:6px;color:var(--primary);font-weight:700;}
.form{max-width:420px;margin:0 auto 1.5rem;background:var(--bg);padding:1.3rem;border-radius:var(--r);border:1px solid var(--line);}
.form label{display:block;margin-bottom:6px;font-weight:600;}
.form input,.form select{width:100%;padding:12px;margin-bottom:14px;border-radius:8px;border:1px solid #c4ccd3;font-size:1rem;background:#fff;}
.form input:focus,.form select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,114,147,.2);}
.err{color:var(--bad);font-weight:600;margin-bottom:10px;min-height:1.4em;}
.btn{background:var(--primary);color:#fff;border:none;padding:.8rem 1.5rem;font-size:1rem;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .2s;}
.btn:hover{background:var(--primary-hover);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-out{background:transparent;color:var(--primary);border:2px solid var(--primary);}
.btn-out:hover{background:var(--primary);color:#fff;}
.btn-big{width:100%;max-width:380px;padding:1rem;font-size:1.1rem;border-radius:50px;}
.center{text-align:center;}
.prog-h{display:flex;justify-content:space-between;font-weight:600;color:var(--muted);margin-bottom:.4rem;font-size:.95rem;}
.prog-bg{background:var(--line);height:10px;border-radius:5px;overflow:hidden;margin-bottom:1.2rem;}
.prog-fill{background:var(--primary);height:100%;transition:width .4s ease;}
.stem{font-size:1.08rem;margin-bottom:1rem;}
.stem p{margin-bottom:.6rem;}
.ask{font-size:1.12rem;font-weight:600;margin:1rem 0;}
.fig{text-align:center;margin:.6rem 0 1rem;}
.fig img{max-width:100%;max-height:420px;width:auto;height:auto;}
.fig .cap,.tbl .cap{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:4px;}
.tbl{margin:.6rem 0 1rem;text-align:center;overflow-x:auto;}
.tbl table{border-collapse:collapse;margin:0 auto;min-width:260px;}
.tbl th,.tbl td{border:1px solid #b8c4ce;padding:8px 16px;text-align:center;}
.tbl th{background:#dce6f1;}
.tbl td:first-child,.tbl th:first-child{text-align:left;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;font-size:1.02rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;color:var(--text);}
.opt:hover{border-color:var(--primary);background:rgba(28,114,147,.05);}
.opt:focus-visible{outline:3px solid rgba(28,114,147,.45);outline-offset:2px;}
.opt.sel{border-color:var(--primary);background:rgba(28,114,147,.1);font-weight:600;}
.let{background:#fff;border-radius:50%;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:1px solid var(--line);}
.nav{display:flex;justify-content:space-between;margin-top:1.6rem;gap:10px;}
.sum{text-align:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.sum h3{color:#fff;border-bottom-color:rgba(255,255,255,.25);}
.score{font-size:3rem;font-weight:700;margin:.6rem 0;}
.medal{font-size:3.4rem;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem;margin-bottom:1.3rem;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}}
.donutw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ok) var(--deg,0deg),var(--bad) 0deg);display:flex;align-items:center;justify-content:center;}
.donut>div{width:108px;height:108px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;}
.legend{display:flex;gap:1rem;margin-top:.9rem;font-size:.9rem;}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
table.res{width:100%;border-collapse:collapse;font-size:.95rem;}
table.res th,table.res td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
table.res th{background:var(--bg);}
.st{padding:3px 10px;border-radius:6px;font-size:.8rem;font-weight:700;white-space:nowrap;display:inline-block;}
.st-ok{background:var(--ok-bg);color:var(--ok);}
.st-bad{background:var(--bad-bg);color:var(--bad);}
.st-skip{background:var(--warn-bg);color:var(--warn);}
.plan{list-style:none;}
.plan li{padding:10px 12px;border-left:4px solid #e0a73a;background:var(--bg);margin-bottom:8px;border-radius:0 var(--r) var(--r) 0;font-size:.95rem;}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;margin-bottom:1rem;}
.rev.ok{background:rgba(26,143,106,.05);border-color:var(--ok);}
.rev.bad{background:rgba(192,36,95,.05);border-color:var(--bad);}
.rev-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:.6rem;gap:8px;flex-wrap:wrap;}
.why{background:#fff;padding:10px 12px;margin-top:10px;border-radius:8px;font-size:.95rem;border-left:4px solid var(--primary);box-shadow:0 2px 4px rgba(0,0,0,.05);}
.why.bad{border-left-color:var(--bad);}
.why ol{margin:6px 0 0 20px;}
.notice{text-align:center;font-weight:600;margin-bottom:1rem;padding:10px;border-radius:var(--r);background:var(--ok-bg);color:var(--ok);}
.notice.warn{background:var(--warn-bg);color:var(--warn);}
.actions{display:flex;gap:1rem;justify-content:center;margin-top:1.4rem;flex-wrap:wrap;}
@media(max-width:480px){table.res{font-size:.85rem;}table.res th,table.res td{padding:8px 4px;}.st{padding:2px 6px;font-size:.75rem;}}
@media print{body{background:#fff;}.container{max-width:100%;padding:0;}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;}.actions,.nav,.prog-h,.prog-bg,.notice{display:none;}.sum{background:none;color:#000;border:2px solid #000;}.sum h3{color:#000;}}
</style>
</head>
<body>
<div class="container" id="app"></div>
<noscript>Este simulado precisa de JavaScript ativado no navegador.</noscript>
<script>
/* Cole aqui a URL do Apps Script (opcional). Deixe vazio para não enviar nada. */
const URL_DA_PLANILHA = "";

const DATA = __DATA__;

const app = document.getElementById('app');
const items = DATA.items, meta = DATA.meta, LET = ['A','B','C','D','E'];
let nome = '', turma = '', idx = 0, t0 = 0, answers = new Array(items.length).fill(null);

const tagOf = c => c.charAt(0)==='C' ? 'Conexão com o 8º ano' : 'Descritor '+c;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nb = s => esc(s).replace(/R\$ /g, () => 'R$&nbsp;').replace(/(\d) (m|h|cm|kg|%)(?![\wÀ-ú])/g, '$1&nbsp;$2');

function landing(){
  app.innerHTML = `
  <div class="card">
    <header><h1>Avalia · ${esc(meta.title)}</h1><h2>${esc(meta.subtitle)}</h2><div class="by">${esc(meta.professor)}</div></header>
    <ul class="intro">
      <li>${items.length} questões de múltipla escolha, com cinco alternativas (A a E).</li>
      <li>Ao final você vê seu resultado, o erro mais provável de cada questão e a resolução.</li>
      <li>É um treino para o Avalia: errar aqui ajuda a estudar.</li>
    </ul>
    <div class="form">
      <label for="in-nome">Seu nome completo</label>
      <input id="in-nome" type="text" autocomplete="name" placeholder="Ex.: Ana Souza">
      <label for="in-turma">Sua turma</label>
      <select id="in-turma"><option value="">Selecione...</option><option>9º Ano A</option><option>9º Ano B</option><option>9º Ano C</option></select>
      <div class="err" id="err" role="alert"></div>
      <div class="center"><button class="btn btn-big" onclick="start()">Começar</button></div>
    </div>
  </div>`;
}
function start(){
  const n = document.getElementById('in-nome').value.trim(), t = document.getElementById('in-turma').value;
  if(!n || !t){ document.getElementById('err').textContent = 'Preencha seu nome e escolha a turma para começar.'; return; }
  nome = n; turma = t; idx = 0; t0 = Date.now(); answers.fill(null); question();
}
function tableHTML(t){
  return `<div class="tbl"><table><thead><tr>${t.header.map(h=>`<th>${nb(h)}</th>`).join('')}</tr></thead><tbody>${
    t.rows.map(r=>`<tr>${r.map(c=>`<td>${nb(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="cap">${nb(t.caption)}</div></div>`;
}
function figHTML(f){ return `<div class="fig"><img src="${f.src}" alt="${esc(f.alt)}"><div class="cap">${nb(f.caption)}</div></div>`; }
function question(){
  const q = items[idx], pct = Math.round(idx / items.length * 100), last = idx === items.length - 1, a = answers[idx];
  app.innerHTML = `
  <div class="card">
    <div class="prog-h"><span>Questão ${idx+1} de ${items.length}</span><span>${pct}%</span></div>
    <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div style="margin-bottom:.8rem"><span class="badge badge-d">${esc(tagOf(q.code))}</span><span class="badge badge-t">${esc(q.short)}</span></div>
    <div class="stem">${q.stem.map(p=>`<p>${nb(p)}</p>`).join('')}</div>
    ${q.table ? tableHTML(q.table) : ''}${q.figure ? figHTML(q.figure) : ''}
    <div class="ask">${nb(q.ask)}</div>
    <div class="opts" role="group" aria-label="Alternativas">${q.options.map((o,i)=>`
      <button class="opt ${a===i?'sel':''}" aria-pressed="${a===i}" onclick="pick(${i})"><span class="let">${o.letter}</span><span>${nb(o.text)}</span></button>`).join('')}</div>
    <div class="nav">
      <button class="btn btn-out" onclick="go(-1)" ${idx===0?'style="visibility:hidden"':''}>Anterior</button>
      ${last ? `<button class="btn" onclick="finish()" ${a===null?'disabled':''}>Finalizar e corrigir</button>`
             : `<button class="btn" onclick="go(1)" ${a===null?'disabled':''}>Próxima</button>`}
    </div>
  </div>`;
  window.scrollTo({top:0});
}
function pick(i){ answers[idx] = i; question(); }
function go(d){ idx = Math.min(items.length-1, Math.max(0, idx+d)); question(); }
const isOk = i => answers[i] !== null && items[i].options[answers[i]].correct;

function finish(){
  const tempo = Math.max(1, Math.round((Date.now()-t0)/60000));
  const acertos = items.reduce((s,_,i)=>s+(isOk(i)?1:0),0), perc = Math.round(acertos/items.length*100);
  const payload = {nome, turma, semana: meta.week, respostas: answers.map(a=>a===null?'-':LET[a]).join(','), acertos, total: items.length, percentual: perc, tempo};
  items.forEach((it,i)=>{ payload[it.code] = isOk(i)?1:0; });
  let sent = null;
  const done = () => dashboard(acertos, perc, tempo, sent);
  if(URL_DA_PLANILHA && URL_DA_PLANILHA.indexOf('script.google.com') >= 0){
    fetch(URL_DA_PLANILHA,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(()=>{sent=true;done();}).catch(()=>{sent=false;done();});
  } else done();
}
function dashboard(acertos, perc, tempo, sent){
  const erros = items.length - acertos;
  let medal = 'Vale revisar a teoria', icon = '📚';
  if(acertos === items.length){ medal = 'Ouro: pronto para o Avalia'; icon = '🏆'; }
  else if(acertos >= items.length-1){ medal = 'Prata: bom domínio'; icon = '🥈'; }
  else if(acertos >= 3){ medal = 'Bronze: na média'; icon = '🥉'; }
  const rows = items.map((it,i)=>{
    const a = answers[i], ok = isOk(i);
    return `<tr><td><strong>${i+1}. ${esc(it.short)}</strong><br><small>${esc(tagOf(it.code))}</small></td>
      <td>${a===null?'-':LET[a]}</td><td>${it.key}</td><td>${ok?'<span class="st st-ok">Acertou</span>':'<span class="st st-bad">Revisar</span>'}</td></tr>`;
  }).join('');
  const tips = items.filter((_,i)=>!isOk(i)).map(it=>`<li><strong>${esc(it.short)}${it.code.charAt(0)==='C'?'':' ('+esc(it.code)+')'}.</strong> ${nb(meta.tips[it.code].charAt(0).toUpperCase()+meta.tips[it.code].slice(1))}</li>`).join('')
             || '<li>Você acertou todas. Continue treinando com problemas contextualizados e confira sempre se o resultado faz sentido.</li>';
  const review = items.map((it,i)=>{
    const a = answers[i], ok = isOk(i), chosen = a===null?null:it.options[a];
    return `<div class="rev ${ok?'ok':'bad'}">
      <div class="rev-h"><span>Questão ${i+1} · ${esc(it.short)}</span><span class="st ${ok?'st-ok':'st-bad'}">${ok?'Acertou':'Revisar'}</span></div>
      <div>${nb(it.ask)}</div>
      <div style="margin-top:6px">Você marcou: <strong>${chosen?chosen.letter+') '+nb(chosen.text):'nenhuma'}</strong>. Gabarito: <strong>${it.key}) ${nb(it.options[LET.indexOf(it.key)].text)}</strong>.</div>
      ${chosen && !ok ? `<div class="why bad"><strong>Por que essa alternativa engana:</strong> ${nb(chosen.why)}</div>` : ''}
      <div class="why"><strong>Resolução:</strong><ol>${it.resolution.map(r=>`<li>${nb(r)}</li>`).join('')}</ol><div style="margin-top:6px"><strong>Conferência:</strong> ${nb(it.check)}</div></div>
    </div>`;
  }).join('');
  app.innerHTML = `
  ${sent===true?'<div class="notice">Resultado enviado ao professor.</div>':''}${sent===false?'<div class="notice warn">Não foi possível enviar o resultado. Avise o professor e mostre esta tela.</div>':''}
  <div class="grid">
    <div class="card sum"><h3>${esc(nome)} · ${esc(turma)}</h3><div class="medal">${icon}</div><div class="score">${acertos} de ${items.length}</div><div>${esc(medal)}</div><div style="margin-top:8px;opacity:.85">${perc}% de acerto · ${tempo} min</div></div>
    <div class="card"><h3>Acertos e erros</h3><div class="donutw"><div class="donut" style="--deg:${acertos/items.length*360}deg"><div>${perc}%</div></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>${acertos} ${acertos===1?'acerto':'acertos'}</span><span><i style="background:var(--bad)"></i>${erros} ${erros===1?'erro':'erros'}</span></div></div></div>
  </div>
  <div class="card"><h3>Resultado por questão</h3>
    <table class="res"><thead><tr><th>Questão e descritor</th><th>Você</th><th>Gabarito</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h3>O que estudar</h3><ul class="plan">${tips}</ul></div>
  <div class="card"><h3>Revisão comentada</h3>${review}</div>
  <div class="by" style="margin-top:1.2rem">Simulado elaborado por ${esc(meta.professor)}</div>
  <div class="actions"><button class="btn btn-out" onclick="window.print()">Imprimir relatório</button><button class="btn" onclick="landing()">Refazer o simulado</button></div>`;
  window.scrollTo({top:0});
}
landing();
</script>
</body>
</html>
